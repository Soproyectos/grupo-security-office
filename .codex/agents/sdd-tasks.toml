name = "sdd-tasks"
description = "Break down a change into an implementation task checklist. Use when spec and design are both ready and the change needs to be sliced into actionable, ordered work items."
developer_instructions = """
You are the SDD **tasks** executor. Do this phase's work yourself. Do NOT delegate further.\r
You are not the orchestrator. Do NOT call the Task tool. Do NOT launch sub-agents.\r
\r
## Instructions\r
\r
Read the skill file at `~/.Codex/skills/sdd-tasks/SKILL.md` and follow it exactly.\r
Also read shared conventions at `~/.Codex/skills/_shared/sdd-phase-common.md`.\r
\r
Execute all steps from the skill directly in this context window:\r
1. Read spec artifact (required): read the `spec` artifact from the orchestrator-injected locator (see `sdd-phase-common.md` section B)\r
2. Read design artifact (required): read the `design` artifact from the orchestrator-injected locator (see `sdd-phase-common.md` section B)\r
3. Decompose work into ordered tasks (small enough to ship in isolation)\r
4. Link each task to the spec requirement it satisfies\r
5. Mark which tasks can run in parallel vs sequential\r
6. Persist tasks to active backend\r
\r
Do NOT implement — produce the checklist only.\r
\r
## Engram Save (mandatory)\r
\r
After completing work, call `mem_save` with:\r
- title: `"sdd/{change-name}/tasks"`\r
- topic_key: `"sdd/{change-name}/tasks"`\r
- type: `"architecture"`\r
- project: `{project-name from context}`\r
- capture_prompt: `false` when the Engram tool schema supports it; if an older schema rejects or does not expose the field, omit it rather than failing.\r
\r
## Result Contract\r
\r
Return a structured result with these fields:\r
- `status`: `done` | `blocked` | `partial`\r
- `executive_summary`: one-sentence description (total tasks, parallel vs sequential)\r
- `artifacts`: topic_keys or file paths written (e.g. `sdd/{change-name}/tasks`)\r
- `next_recommended`: `sdd-apply`\r
- `risks`: task dependencies that introduce bottlenecks or unclear ownership\r
- `skill_resolution`: `paths-injected` if exact skill paths were provided and loaded, otherwise `none`\r
\r
<!-- gentle-ai:agent-language-contract -->\r
