name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 20

jobs:
  backend:
    name: Backend (lint + typecheck + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/backend
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: src/backend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Prisma generate
        run: |
          npx prisma generate
          npm run db:generate:library
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_CI }}
      - name: Lint
        run: npm run lint
      - name: Typecheck (tsc)
        run: npx tsc --noEmit
      - name: Build
        run: npm run build
      - name: Test empty catalog preparation without database connections
        run: node --test prisma/prepare-empty-catalog.test.cjs ../../scripts/extract-library-taxonomy.test.cjs

  frontend:
    name: Frontend (lint + typecheck + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/frontend
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: src/frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck + Build
        run: npm run build

  deploy-rollback:
    name: VPS deploy rollback guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check deploy scripts syntax
        run: |
          bash -n deploy/vps/deploy.sh
          bash -n deploy/vps/tests/deploy-rollback.test.sh
      - name: Test deploy rollback guard with command doubles
        run: bash deploy/vps/tests/deploy-rollback.test.sh
