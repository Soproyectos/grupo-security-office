server {
    listen 80;
    listen [::]:80;
    server_name dev.gruposecurity.cloud;
    server_tokens off;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 308 https://dev.gruposecurity.cloud$request_uri;
    }
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name dev.gruposecurity.cloud;
    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/dev.gruposecurity.cloud/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dev.gruposecurity.cloud/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    client_max_body_size 25m;
    error_page 502 503 504 =503 /_maintenance.html;

    location = /_maintenance.html {
        internal;
        root /var/www/grupo-security;
        add_header Cache-Control "no-store" always;
    }

    location ^~ /api/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 60s;
    }

    location ^~ /uploads/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 60s;
    }

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 60s;
    }
}

server {
    listen 19999 ssl;
    listen [::]:19999 ssl;
    server_name dev.gruposecurity.cloud;
    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/dev.gruposecurity.cloud/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dev.gruposecurity.cloud/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    location / {
        proxy_pass http://127.0.0.1:19998;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Connection "";
    }
}
