server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name 57.131.50.38 _;
    server_tokens off;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 308 https://dev.gruposecurity.cloud$request_uri;
    }
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name 57.131.50.38 _;
    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/57.131.50.38/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/57.131.50.38/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    client_max_body_size 25m;
    location / {
        return 308 https://dev.gruposecurity.cloud$request_uri;
    }
}
