# ============================================================
# docker-compose.prod.yml - Production (pre-built GHCR images)
# ============================================================
# On the VPS this file is always combined with the override, which keeps the
# bundled nginx out of `up`, binds api/frontend to 127.0.0.1 and adds
# MFA_ENCRYPTION_KEY (see deploy/vps/ and docs/procedimientos/deploy-vps.md):
#   IMAGE_TAG=<sha8> docker compose -p grupo-security \
#     -f docker-compose.prod.yml -f deploy/vps/docker-compose.override.yml up -d
#
# Images are tagged with the first 8 characters of the git SHA.

services:
  # ---- Reverse proxy (SSL termination) ----
  nginx:
    image: nginx:1.27-alpine
    container_name: gs-nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/ssl/grupo-security:/etc/nginx/ssl:ro
    depends_on:
      api:
        condition: service_healthy
      frontend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:80/"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ---- Backend (NestJS) ----
  api:
    image: ghcr.io/soproyectos/grupo-security-office/api:${IMAGE_TAG:-latest}
    container_name: gs-api
    restart: always
    expose:
      - "3000"
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_DRIVER: postgres
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-8h}
      CORS_ORIGIN: ${CORS_ORIGIN:?CORS_ORIGIN is required}
      API_PORT: 3000
    volumes:
      - uploads:/app/uploads
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s

  # ---- Frontend (Nginx static files) ----
  frontend:
    image: ghcr.io/soproyectos/grupo-security-office/frontend:${IMAGE_TAG:-latest}
    container_name: gs-frontend
    restart: always
    expose:
      - "80"
    depends_on:
      - api
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:80/"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ---- PostgreSQL ----
  db:
    image: postgres:18-alpine
    container_name: gs-db
    restart: always
    expose:
      - "5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-grupo_security}
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB:-grupo_security}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
  uploads:
