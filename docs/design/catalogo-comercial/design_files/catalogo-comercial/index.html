<!doctype html>
<html lang="es"><head>
<meta charset="utf-8">
<title>Catálogo Comercial — Grupo Security</title>
<link rel="stylesheet" href="../../styles.css">
<script src="../../_ds_bundle.js"></script>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<style>body{margin:0}</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel" src="screens/Home.jsx"></script>
<script type="text/babel" src="screens/ClientLogin.jsx"></script>
<script type="text/babel" src="screens/SolicitarAcceso.jsx"></script>
<script type="text/babel">
function App() {
  const [screen, setScreen] = React.useState('home');
  const nav = (s) => setScreen(s);
  const S = window.StoreScreens;
  if (screen === 'login') return <S.ClientLogin onBack={() => nav('home')} onRequest={() => nav('solicitar')} />;
  if (screen === 'solicitar') return <S.SolicitarAcceso onBack={() => nav('home')} />;
  return <S.Home onLogin={() => nav('login')} onRequest={() => nav('solicitar')} />;
}
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body></html>
